<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070a12">
  <title>Pink LPS Studio Next</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./satellite.css">
  <link rel="stylesheet" href="./spatial.css">
  <script src="../../pink-public-config.js"></script>
  <script src="../../vision/pink-vision.js"></script>
</head>
<body>
  <div class="app-shell" data-mode="command-center">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">P</span><div><strong>PINK</strong><small>LPS STUDIO NEXT</small></div></div>
      <div class="health" id="health-strip" aria-live="polite"></div>
      <button class="ghost" id="spatial-toggle" type="button" aria-pressed="false">Spatial OS</button><button class="ghost" id="mode-toggle" type="button">Pink Only</button>
    </header>
    <aside class="nav" aria-label="Navegação">
      <button class="nav-item active" data-view="home">Visão Geral</button><button class="nav-item" data-view="tasks">Tarefas</button><button class="nav-item" data-view="memory">Memória</button><button class="nav-item" data-view="skills">Skills</button><button class="nav-item" data-view="satellite">Satellite</button><button class="nav-item" data-view="evolution">Autoevolução</button><button class="nav-item" data-view="security">Segurança</button>
    </aside>
    <main class="workspace">
      <section class="hero-card" id="pink-stage"><div class="spatial-stage" id="spatial-stage" hidden><div class="spatial-grid" aria-hidden="true"></div><svg class="spatial-links" id="spatial-links" aria-hidden="true"></svg><div class="spatial-particles" id="spatial-particles" aria-hidden="true"></div><div class="spatial-orbit" id="spatial-orbit"></div><div class="spatial-core" id="spatial-core"><span>PINK</span><small>MISSION CONTROL</small><i class="spatial-core-pulse" aria-hidden="true"></i></div><div class="spatial-hud"><div><small>MISSÕES</small><strong id="spatial-task-count">0</strong></div><div><small>AGENTES</small><strong id="spatial-agent-count">0</strong></div><div><small>ESTADO</small><strong id="spatial-core-state">IDLE</strong></div><button type="button" id="spatial-quality" class="spatial-quality" aria-label="Alternar qualidade gráfica do Spatial OS">BALANCED</button><button type="button" id="spatial-camera" class="spatial-quality" aria-pressed="false">CAM OFF</button></div><div class="spatial-status" id="spatial-status" aria-live="polite">POINTER · BALANCED</div></div><div class="orb" aria-hidden="true"><div class="orb-core"></div></div><div class="hero-copy"><span class="eyebrow">TALK · BUILD · OPERATE</span><h1>Pink Next</h1><p>Runtime reconstruído: tasks persistentes, contexto limitado, tools progressivas e segurança fora do LLM.</p></div></section>
      <section class="panel-grid" id="dashboard"></section>
    </main>
    <aside class="inspector"><div class="inspector-head"><span>Task Runtime</span><span class="status-dot"></span></div><div id="task-list" class="task-list"></div></aside>
    <footer class="composer"><label class="composer-box"><span class="sr-only">Comando para a Pink</span><textarea id="prompt" rows="1" placeholder="Converse, dê uma tarefa ou anexe um arquivo para a Pink ler..."></textarea><button id="send" type="button">Executar</button></label></footer>
  </div>
  <script type="module" src="./main.mjs"></script>
  <script type="module" src="./attachments.mjs"></script>
</body>
</html>
