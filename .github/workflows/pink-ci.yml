name: Pink CI

on:
  push:
    branches:
      - main
      - 'phase/**'
      - 'evolution/**'
      - 'feature/**'
      - 'lab/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  runtime-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Secret scan
        run: node scripts/secret-scan.cjs
      - name: Dependency and license audit
        run: node scripts/dependency-audit.cjs
      - name: JavaScript syntax
        run: |
          node --check pink-public-config.js
          node --check foundation/pink-foundation.js
          node --check foundation/pink-confirm-gate.js
          node --check foundation/pink-undo-stack.js
          node --check core/pink-operating-core.js
          node --check voice/pink-voice-os.js
          node --check voice/pink-local-voice.js
          node --check voice/pink-gemini-live.js
          node --check memory/pink-memory-core.js
          node --check memory/pink-memory-supabase.mjs
          node --check memory/pink-memory-bridge.js
          node --check app.js
          node --check pink-core.js
          node --check pink-evolution.js
          node --check pink-nvidia.js
          node --check pink-panel-router.js
          node --check pink-store-router.js
          node --check visual/pink-performance.js
          node --check visual/pink-avatar-controller.js
          node --check visual/pink-avatar-registry.js
          node --check visual/pink-avatar-model-adapter.mjs
          node --check visual/pink-avatar-performance-bridge.mjs
          node --check visual/pink-voice-reactive.js
          node --check visual/pink-holographic-ui.js
          node --check visual/pink-3d-presence.js
          node --check visual/pink-runtime-health.js
      - name: Python syntax and local voice self-test
        run: |
          python -m py_compile companion/local_voice_service.py
          python companion/local_voice_service.py --self-test
      - name: Foundation safety contracts
        run: node tests/foundation-safety.cjs
      - name: Human confirmation and undo contracts
        run: node tests/confirm-undo.cjs
      - name: Core intelligence contracts
        run: node tests/core-intelligence.cjs
      - name: Independent audit safety boundaries
        run: node tests/audit-safety-boundaries.cjs
      - name: Local voice safety contracts
        run: node tests/local-voice-contracts.cjs
      - name: Voice OS contracts
        run: node tests/voice-os.cjs
      - name: Memory and People Graph contracts
        run: node tests/memory-core.cjs
      - name: Presence lifecycle
        run: node tests/presence-lifecycle.cjs
      - name: Avatar controller
        run: node tests/avatar-controller.cjs
      - name: Avatar Supabase registry
        run: node tests/avatar-registry.cjs
      - name: Avatar model adapter
        run: node tests/avatar-model-adapter.cjs
      - name: Avatar validation gate
        run: node tests/avatar-validation-gate.cjs
      - name: Voice reactive lip sync
        run: node tests/voice-reactive.cjs
      - name: Holographic UI modes
        run: node tests/holographic-ui.cjs
      - name: Adaptive performance governor
        run: node tests/performance-governor.cjs
      - name: Runtime health and avatar performance
        run: node tests/runtime-health.cjs

  browser-smoke:
    needs: runtime-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright
        run: npm install --no-save --ignore-scripts playwright@1.63.0
      - name: Install Chromium
        run: npx playwright@1.63.0 install --with-deps chromium
      - name: Desktop and mobile browser smoke
        run: node tests/browser-smoke.cjs
