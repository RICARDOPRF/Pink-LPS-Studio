name: Pink CI
on:
  push:
    branches: [main, 'phase/**', 'evolution/**', 'feature/**', 'lab/**', 'pink-n5/**', 'rebuild/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  runtime-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Setup Python
        uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Secret scan
        run: node scripts/secret-scan.cjs
      - name: Dependency and license audit
        run: node scripts/dependency-audit.cjs
      - name: JavaScript syntax
        run: |
          node --check pink-public-config.js
          node --check runtime/pink-speech-text.js
          node --check foundation/pink-foundation.js
          node --check foundation/pink-confirm-gate.js
          node --check foundation/pink-undo-stack.js
          node --check governance/pink-autonomy-console.js
          node --check governance/pink-engineering-panel.js
          node --check core/pink-operating-core.js
          node --check core/pink-intent-context-router.js
          node --check agents/pink-openai.js
          node --check agents/pink-gemini-research.js
          node --check agents/pink-unified-ai-gateway.js
          node --check agents/pink-model-router.js
          node --check runtime/pink-agent-harness.js
          node --check runtime/pink-supervisor-voice.js
          node --check voice/pink-gemini-live.js
          node --check vision/pink-vision.js
          node --check vision/pink-camera-router.js
          node --check tools/pink-tool-registry.js
          node --check memory/pink-memory-core.js
          node --check memory/pink-memory-supabase.mjs
          node --check memory/pink-memory-bridge.js
          node --check pink-core.js
          node --check pink-evolution.js
          node --check pink-nvidia.js
          node --check pink-panel-router.js
          node --check pink-store-router.js
          node --check evolution/pink-autonomous-evolution.js
          node --check evolution/pink-engineering-loop.js
          node --check platform/pink-platform.js
          node --check ui/pink-command-center.js
          node --check visual/pink-performance.js
          node --check visual/pink-avatar-controller.js
          node --check visual/pink-avatar-registry.js
          node --check visual/pink-avatar-model-adapter.mjs
          node --check visual/pink-avatar-performance-bridge.mjs
          node --check visual/pink-voice-reactive.js
          node --check visual/pink-holographic-ui.js
          node --check visual/pink-3d-presence.js
          node --check visual/pink-orb-console.mjs
          node --check visual/pink-runtime-health.js
          node --check scripts/pink-n5-autopilot.mjs
          find packages apps/next -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Natural speech and file reader contracts
        run: node tests/natural-speech-and-files.cjs
      - name: Local Companion syntax and safety self-test
        run: |
          python -m py_compile companion/local_voice_service.py companion/satellite_service.py
          python companion/local_voice_service.py --self-test
          python companion/satellite_service.py --self-test
          python tests/satellite-service-security.py
      - name: Pink Satellite browser client contracts
        run: node tests/satellite-client.mjs
      - name: Foundation safety contracts
        run: node tests/foundation-safety.cjs
      - name: Human confirmation and undo contracts
        run: node tests/confirm-undo.cjs
      - name: V14 agent harness contracts
        run: node tests/agent-harness.cjs
      - name: Tool capability risk contracts
        run: node tests/tool-risk.cjs
      - name: Operational senses contracts
        run: node tests/operational-senses.cjs
      - name: Core intelligence contracts
        run: node tests/core-intelligence.cjs
      - name: Unified AI Gateway contracts
        run: node tests/unified-ai-gateway.cjs
      - name: Engineering evolution contracts
        run: node tests/engineering-evolution.cjs
      - name: N5 autonomous evolution policy
        run: node tests/n5-autopilot-policy.cjs
      - name: Independent audit safety boundaries
        run: node tests/audit-safety-boundaries.cjs
      - name: Memory and People Graph contracts
        run: node tests/memory-core.cjs
      - name: Presence lifecycle
        run: node tests/presence-lifecycle.cjs
      - name: Avatar controller
        run: node tests/avatar-controller.cjs
      - name: Avatar Supabase registry
        run: node tests/avatar-registry.cjs
      - name: Avatar model adapter
        run: node tests/avatar-model-adapter.cjs
      - name: Avatar validation gate
        run: node tests/avatar-validation-gate.cjs
      - name: Voice reactive lip sync
        run: node tests/voice-reactive.cjs
      - name: Holographic UI modes
        run: node tests/holographic-ui.cjs
      - name: Adaptive performance governor
        run: node tests/performance-governor.cjs
      - name: Runtime health and avatar performance
        run: node tests/runtime-health.cjs
      - name: Pink Next architecture contracts
        run: node tests/pink-next-contracts.mjs
      - name: Pink Next behavioral evals
        run: node tests/pink-next-behavioral.mjs
      - name: Pink Next agentic governance
        run: node tests/pink-next-agentic.mjs
      - name: Pink Next handoff, guardrail and trace-span contracts
        run: node tests/pink-next-interop.mjs
      - name: Pink Next V16 multi-agent orchestrator contracts
        run: node tests/pink-next-orchestrator.mjs
      - name: Pink V17 Project Brain and Graphiti adapter contracts
        run: node tests/pink-next-project-brain.mjs
      - name: Pink V18 Training Studio and MiniMind adapter contracts
        run: node tests/pink-next-model-lab.mjs
      - name: Pink V19 Agent Learning and Agent Lightning contracts
        run: node tests/pink-next-agent-learning.mjs
      - name: Pink V20 OS Foundation contracts
        run: node tests/pink-next-os-foundation.mjs
      - name: Pink V21 Spatial Kernel contracts
        run: node tests/pink-next-spatial-kernel.mjs
      - name: Pink V22 Spatial Mission Control contracts
        run: node tests/pink-next-spatial-mission-control.mjs
      - name: Pink V23 Living Spatial Interface contracts
        run: node tests/pink-next-living-spatial.mjs

  satellite-windows:
    needs: runtime-checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Build and packaged self-test
        shell: powershell
        run: ./companion/build-pink-satellite.ps1 -Python python -Clean
      - name: Installer smoke
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'PinkLPS'
          ./companion/install-pink-satellite.ps1 -ExePath ./dist/PinkSatellite.exe -AllowedRoot $root
          $installed = Join-Path $env:LOCALAPPDATA 'PinkLPS\Satellite\PinkSatellite.exe'
          if (-not (Test-Path $installed)) { throw 'Installed PinkSatellite.exe missing' }
          & $installed --self-test
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: PinkSatellite-Windows-x64
          path: dist/PinkSatellite.exe
          if-no-files-found: error
          retention-days: 14

  browser-smoke:
    needs: runtime-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install pinned Playwright
        run: npm install --no-save --ignore-scripts playwright@1.63.0
      - name: Install Chromium
        run: npx playwright@1.63.0 install --with-deps chromium
      - name: Legacy desktop and mobile browser smoke
        run: node tests/browser-smoke.cjs
      - name: Pink Next desktop and mobile browser smoke
        run: node tests/pink-next-browser-smoke.cjs
